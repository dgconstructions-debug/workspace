<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DG Workspace – Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .logo { flex: 1; text-align: center; }
    .logo img { height: 60px; width: 60px; max-width: 60px; max-height: 60px; object-fit: contain; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.10); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4"
  style="background: linear-gradient(135deg, #0F1E36 0%, #1B2B4B 60%, #243a5e 100%);">

  <!-- Subtle top stripe -->
  <div class="fixed top-0 left-0 right-0 h-1 bg-orange-500"></div>

  <div class="w-full max-w-md">
    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-orange-500 rounded-2xl mb-4 shadow-xl">
      </div>
      <h1 class="text-3xl font-black text-white tracking-tight">
        <span class="text-orange-400">DG</span> Workspace
      </h1>
      <p class="text-slate-400 text-sm mt-1 font-medium">D G Constructions, Pune</p>
      <p class="text-slate-500 text-xs mt-0.5">Task delegation &amp; team management</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, msg in messages %}
            <div class="mb-4 px-4 py-3 rounded-lg text-sm font-medium
              {% if category == 'error' %}bg-red-50 text-red-700 border border-red-200
              {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
              {{ msg }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-[#1B2B4B] mb-1.5">Mobile number</label>
          <input type="text" name="mobile" placeholder="91XXXXXXXXXX" required
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-[#1B2B4B] mb-1.5">Password</label>
          <input type="password" name="password" required
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition" />
        </div>
        <button type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-lg transition text-sm shadow-md tracking-wide">
          Sign In →
        </button>
      </form>
    </div>

    <p class="text-center text-slate-600 text-xs mt-6">© 2026 D G Constructions, Pune</p>
  </div>

</body>
</html>
